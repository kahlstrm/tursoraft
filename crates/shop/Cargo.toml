[package]
name = "tursoraft-shop"
description = "A small store on a tursoraft cluster, its load generator and its checker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "tursoraft-shop"
path = "src/main.rs"

[dependencies]
tursoraft-node = { path = "../node" }
tursoraft-relay = { path = "../relay" }
tursoraft-raft.workspace = true
axum = "0.8"
futures-util = "0.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

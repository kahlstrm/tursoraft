[package]
name = "tursoraft-node"
description = "A tursoraft node: embeds the database and joins the Raft cluster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "tursoraft-node"
path = "src/bin/tursoraft-node.rs"

[dependencies]
tursoraft-statemachine.workspace = true
tursoraft-changeset.workspace = true
tursoraft-raft.workspace = true
# Recognizes statements the read path accepts.
turso_parser.workspace = true
openraft.workspace = true
serde.workspace = true
thiserror.workspace = true
bincode = "1.3"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

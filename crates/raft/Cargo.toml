[package]
name = "tursoraft-raft"
description = "Raft layer (openraft) that orders opaque proposals and applies them through a StateMachine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "tursoraft-raft-node"
path = "src/bin/tursoraft-raft-node.rs"

[dependencies]
tursoraft-statemachine.workspace = true
openraft.workspace = true
futures-util = "0.3"
serde.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
bincode = "1.3"
serde_json = "1"
crc32fast = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
